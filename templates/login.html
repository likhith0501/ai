<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | AI Cyber Threat Detection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="container" style="min-height:100vh; display:flex; align-items:center;">
    <div class="panel mx-auto w-100" style="max-width: 420px;">
      <div class="text-center mb-3">
        <div class="brand-shield mx-auto mb-2" style="width:48px;height:48px;font-size:1.4rem;">&#128737;</div>
        <h5 class="mb-1">AI Threat Detection</h5>
        <div class="text-secondary small">Unidirectional IP traffic analyser</div>
      </div>

      {% if error %}
      <div class="alert-cyber">{{ error }}</div>
      {% endif %}

      <form method="post" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="stat-label mb-1" for="password">Access password</label>
          <input class="form-control" type="password" id="password" name="password"
                 required autofocus placeholder="Enter the CYBER_THREAT_PASSWORD value">
        </div>
        <button class="btn btn-cyber btn-accent w-100" type="submit">Sign in</button>
      </form>

      <p class="text-secondary small mt-3 mb-0 text-center">
        Access is controlled by the <span class="mono">CYBER_THREAT_PASSWORD</span> environment
        variable on the server. No credentials are stored in the source code.
      </p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
